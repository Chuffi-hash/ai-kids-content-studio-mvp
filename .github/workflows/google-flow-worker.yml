name: Google Flow Worker & Integration Checks

on:
  push:
    branches:
      - feat/remotion-renderer-pilot
    paths:
      - "flow-worker/**"
      - "frontend/**"
      - "remotion/**"
      - "backend/**"
      - ".github/workflows/google-flow-worker.yml"
  pull_request:
    branches:
      - feat/remotion-renderer-pilot
    paths:
      - "flow-worker/**"
      - "frontend/**"
      - "remotion/**"
      - "backend/**"
      - ".github/workflows/google-flow-worker.yml"

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        run: npm install
      - name: Syntax-check worker entrypoints and run unit tests
        run: npm test

  remotion-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Remotion dependencies
        run: npm install
      - name: Run Remotion typecheck
        run: npm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Remotion dependencies for sibling types
        run: npm --prefix remotion install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Build frontend and run TypeScript checks
        run: npm --prefix frontend run build

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install
      - name: Build backend and run TypeScript checks
        run: npm run build
