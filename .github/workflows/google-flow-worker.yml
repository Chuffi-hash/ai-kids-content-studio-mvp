name: Google Flow Worker & Integration Checks

on:
  push:
    branches:
      - feat/remotion-renderer-pilot
    paths:
      - "flow-worker/**"
      - "frontend/**"
      - "remotion/**"
      - "backend/**"
      - ".github/workflows/google-flow-worker.yml"
  pull_request:
    branches:
      - feat/remotion-renderer-pilot
    paths:
      - "flow-worker/**"
      - "frontend/**"
      - "remotion/**"
      - "backend/**"
      - ".github/workflows/google-flow-worker.yml"

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        run: npm install
      - name: Syntax-check worker entrypoints and run unit tests
        run: npm test

  remotion-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Remotion dependencies
        run: npm install
      - name: Run Remotion typecheck
        run: npm run typecheck
      - name: Run Remotion manifest and animation tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Remotion dependencies for sibling types
        run: npm --prefix remotion install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Build frontend and run TypeScript checks
        run: npm --prefix frontend run build

  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=public
      - name: Verify schema consistency and migration status
        run: |
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema ./prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=public
      - name: Build backend and run TypeScript checks
        run: npm run build
      - name: Run deterministic unit and workflow tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          STORAGE_DIR: ./storage
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=public
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
          STORY_PROVIDER: deterministic
